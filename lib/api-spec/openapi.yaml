openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: getProjectHealth
      tags: [health]
      summary: Returns the original project health message
      responses:
        "200":
          description: Project health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHealth"
  /summarize:
    post:
      operationId: summarizeValues
      tags: [summary]
      summary: Calculates basic statistics for a list of numbers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumberSummaryInput"
      responses:
        "200":
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumberSummary"
        "422":
          description: Invalid list of values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProjectHealth:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
        - status
        - message
    NumberSummaryInput:
      type: object
      properties:
        values:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: number
      required:
        - values
    NumberSummary:
      type: object
      properties:
        count:
          type: integer
        min:
          type: number
        max:
          type: number
        average:
          type: number
      required:
        - count
        - min
        - max
        - average
    ValidationError:
      type: object
      properties:
        detail:
          type: string
      required:
        - detail

